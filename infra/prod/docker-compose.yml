# Production stack on one Ubuntu VPS (ADR-16): Postgres, the API and Caddy (HTTPS).
# Lives in /opt/campusstay on the VPS next to its .env (from .env.example). The backend workflow
# (.github/workflows/backend.yml) copies this folder there on every deploy and runs
#   docker compose pull api && docker compose up -d
# The db service runs only with the profile local-db (COMPOSE_PROFILES=local-db in .env). Without it the API
# uses the managed database in DB_URL, e.g. Azure Database for PostgreSQL (runbook appendix A).
# Runbook: infra/prod/README.md.
name: campusstay

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # keep the disk from filling up over months
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusstay
      POSTGRES_USER: ${DB_USER:-campusstay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campusstay} -d campusstay"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    # No published port: only the api container reaches the database.

  api:
    image: ${API_IMAGE:-ghcr.io/tisou47/campusstay-backend}:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false   # no db service with a managed database
    # Only the variables written in .env reach the API, so an unset one keeps its default in application.yml.
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/campusstay}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
    volumes:
      - api-files:/app/data/files     # uploaded receipts and photos: backed up with the database (backup.sh)
      - ./secrets:/app/secrets:ro     # Firebase service account key (FIREBASE_CREDENTIALS_FILE)
    mem_limit: ${API_MEMORY:-2g}   # the JVM takes 75% of it as heap (backend/Dockerfile); 1g on a 2 GB VPS
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates: keep, or Let's Encrypt rate limits apply on re-issue
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  api-files:
  caddy-data:
  caddy-config:
