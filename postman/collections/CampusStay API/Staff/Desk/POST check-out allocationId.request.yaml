$kind: http-request
name: '/check-out/{allocationId}'
method: POST
url: '{{baseUrl}}/check-out/:allocationId'
order: 6000
description: |-
  `POST /check-out/{allocationId}` `{ electricity, water, conditionGood, keyReturned, damageCharge, draft }` → `{ refund, refundStatus }`

  Contract: `docs/api-contract.md` › Staff (also used by the Manager for its Block) › Desk
pathVariables:
  - key: allocationId
    value: ''
    description: 'Allocation id'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "electricity": 0,
      "water": 0,
      "conditionGood": false,
      "keyReturned": false,
      "damageCharge": 0,
      "draft": false,
      "damages": [
        {
          "itemId": "",
          "amount": 0,
          "note": ""
        }
      ]
    }
