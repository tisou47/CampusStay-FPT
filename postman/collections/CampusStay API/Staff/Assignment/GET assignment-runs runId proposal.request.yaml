$kind: http-request
name: '/assignment-runs/{runId}/proposal'
method: GET
url: '{{baseUrl}}/assignment-runs/:runId/proposal?block={{block}}'
order: 170000
description: |-
  `GET /assignment-runs/{runId}/proposal?block&view=conflicts|proposed|all&q&page&pageSize` → `{ run: { id, status, snapshot }, blocks: [{ block, total, conflicts, status: 'review'|'submitted'|'approved' }], waitlistedCount, items: [{ applicationId, studentName, studentCode, pair, preference, bed, fit, issue: { label, tone } | null, resolved, reason }], total, commitSummary: { students, balanceDueAt } }`. `block=waitlisted` lists waitlisted Applications.

  Contract: `docs/api-contract.md` › Staff (also used by the Manager for its Block) › Assignment
pathVariables:
  - key: runId
    value: ''
    description: 'Assignment run id, e.g. RUN-3'
queryParams:
  - key: block
    value: '{{block}}'
  - key: view
    value: ''
    disabled: true
  - key: q
    value: ''
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: pageSize
    value: '20'
    disabled: true
