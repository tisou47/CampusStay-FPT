$kind: http-request
name: '/room-class-changes'
method: GET
url: '{{baseUrl}}/room-class-changes?termId={{termId}}&block={{block}}'
order: 224000
description: |-
  `GET /room-class-changes?termId&block&status` → `{ items, total, window }`

  Contract: `docs/api-contract.md` › Staff (also used by the Manager for its Block) › Term transition
queryParams:
