$kind: http-request
name: '/payment-claims'
method: GET
url: '{{baseUrl}}/payment-claims?termId={{termId}}&block={{block}}'
order: 8000
description: |-
  `GET /payment-claims?termId&block&type&since&q&page&pageSize` → `{ items: [{ invoiceId, studentName, studentCode, type, typeLabel, title, amount, claimedAt, dueAt, timeLeftSeconds, reference, rejected, transferContent }], total, summary: { count, amount }, types }`

  Contract: `docs/api-contract.md` › Staff (also used by the Manager for its Block) › Applications and payments
queryParams:
  - key: termId
    value: '{{termId}}'
  - key: block
    value: '{{block}}'
  - key: type
    value: ''
    disabled: true
  - key: since
    value: ''
    disabled: true
  - key: q
    value: ''
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: pageSize
    value: '20'
    disabled: true
