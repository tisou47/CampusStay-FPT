$kind: http-request
name: '/devices'
method: POST
url: '{{baseUrl}}/devices'
order: 7000
description: |-
  POST `/devices` · `/devices/unregister` — request: Android only: `{ token, platform: 'android' }` after sign-in and on token refresh · `{ token }` before sign-out — response: `204`; notifications are then also pushed (C-25)

  Contract: `docs/api-contract.md` › Session and shared
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "",
      "platform": ""
    }
