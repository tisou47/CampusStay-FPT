$kind: http-request
name: '/auth/password/set'
method: POST
url: '{{baseUrl}}/auth/password/set'
order: 5000
description: |-
  POST `/auth/password/set` — request: `{ newPassword }` — the first password of an account from Google sign-up — response: `204`; `409 PASSWORD_ALREADY_SET` (A-17)

  Contract: `docs/api-contract.md` › Session and shared
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newPassword": ""
    }
