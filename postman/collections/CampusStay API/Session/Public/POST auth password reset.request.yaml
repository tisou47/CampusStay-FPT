$kind: http-request
name: '/auth/password/reset'
method: POST
url: '{{baseUrl}}/auth/password/reset'
order: 4000
description: |-
  POST `/auth/password/reset` — request: `{ token, newPassword }` — used by both the reset and the set-password (invitation) page — response: `204`; every session of the user is signed out

  Contract: `docs/api-contract.md` › Session and shared › Public
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "",
      "newPassword": ""
    }
