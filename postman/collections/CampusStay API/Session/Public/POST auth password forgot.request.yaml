$kind: http-request
name: '/auth/password/forgot'
method: POST
url: '{{baseUrl}}/auth/password/forgot'
order: 3000
description: |-
  POST `/auth/password/forgot` — request: `{ email }` — response: `204` always (does not reveal whether the email exists)

  Contract: `docs/api-contract.md` › Session and shared › Public
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": ""
    }
