$kind: http-request
name: '/late-check-ins'
method: GET
url: '{{baseUrl}}/late-check-ins?termId={{termId}}&block={{block}}'
order: 2000
description: |-
  `GET /late-check-ins?termId&block` → `{ items: [{ id, studentCode, name, allocation, reason, receivedBy, paid, payment, requestedFor, evidence: { name, url }, windowClosedAt, suggestedDeadline, decision: { status, deadline, reason } | null, source }] }` (`source` Online or Desk, A-36)

  Contract: `docs/api-contract.md` › Manager › Late check-ins and terminations
queryParams:
  - key: termId
    value: '{{termId}}'
  - key: block
    value: '{{block}}'
