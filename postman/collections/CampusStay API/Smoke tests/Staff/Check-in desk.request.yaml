$kind: http-request
method: GET
url: '{{baseUrl}}/check-in/today?termId={{termId}}&block={{block}}'
order: 4000
queryParams:
  - key: termId
    value: '{{termId}}'
  - key: block
    value: '{{block}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with date, expected, checkedIn, waiting', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.include.keys('date', 'expected', 'checkedIn', 'waiting');
      });
