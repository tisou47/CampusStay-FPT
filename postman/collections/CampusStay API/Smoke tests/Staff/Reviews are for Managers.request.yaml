$kind: http-request
method: GET
url: '{{baseUrl}}/applications?termId={{termId}}&block={{block}}'
order: 11000
queryParams:
  - key: termId
    value: '{{termId}}'
  - key: block
    value: '{{block}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('403 FORBIDDEN', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().code).to.eql('FORBIDDEN');
      });
