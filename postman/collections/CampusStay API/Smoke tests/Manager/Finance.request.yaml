$kind: http-request
method: GET
url: '{{baseUrl}}/finance/summary?termId={{termId}}&block={{block}}'
order: 8000
queryParams:
  - key: termId
    value: '{{termId}}'
  - key: block
    value: '{{block}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with invoiced, collected, overdueCount', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.include.keys('invoiced', 'collected', 'overdueCount');
      });
