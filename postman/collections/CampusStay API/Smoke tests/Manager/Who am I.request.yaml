$kind: http-request
method: GET
url: '{{baseUrl}}/auth/me'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200: signed in as manager', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().role).to.eql('manager');
      });
      pm.variables.set('cs.allBlocks', JSON.stringify(pm.response.json().blocks || []));
