$kind: http-request
method: GET
url: '{{baseUrl}}/admin/permissions'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with the four roles', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().roles.map((r) => r.key)).to.eql(['student', 'staff', 'manager', 'admin']);
        pm.expect(pm.response.json().rows).to.be.an('array').that.is.not.empty;
      });
