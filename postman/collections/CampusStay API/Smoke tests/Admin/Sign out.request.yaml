$kind: http-request
method: POST
url: '{{baseUrl}}/auth/sign-out'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204: signed out', () => pm.response.to.have.status(204));
      pm.collectionVariables.unset(pm.variables.get('cs.role') + 'Token');
