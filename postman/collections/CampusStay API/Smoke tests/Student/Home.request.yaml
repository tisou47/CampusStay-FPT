$kind: http-request
method: GET
url: '{{baseUrl}}/students/me/home?termId={{termId}}'
order: 4000
queryParams:
  - key: termId
    value: '{{termId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with firstName, application, allocation, invoices', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.include.keys('firstName', 'application', 'allocation', 'invoices');
      });
