$kind: http-request
method: GET
url: '{{baseUrl}}/terms'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with { items, total }', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().items).to.be.an('array');
        pm.expect(pm.response.json().total).to.be.a('number');
      });
      // The current Term for the rest of the run, unless the environment names one.
      const term = pm.response.json().items.find((t) => t.current) || pm.response.json().items[0];
      if (!pm.variables.get('termId') && term) pm.variables.set('termId', term.id);
