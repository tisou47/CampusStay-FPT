$kind: http-request
name: '/admin/terms/{id}/publish'
method: POST
url: '{{baseUrl}}/admin/terms/:id/publish'
order: 7000
description: |-
  `POST /admin/terms/{id}/publish` (Terms are created and changed only through the wizard: the one-form `POST /admin/terms` and `PUT /admin/terms/{id}` were removed, BE-3RD-08). Instants: `registrationOpensAt`, `registrationClosesAt`, `resultsPublishedAt`, `balanceDueAt`; dates (`YYYY-MM-DD`): `stayStart`, `stayEnd`, `checkInStart`, `checkInEnd`, `checkOutBy`. The Term's `depositHours` is the Deposit window used for its Applications (`/terms` returns it as `depositWindowHours`).

  Contract: `tools/postman/api-contract.md` › Admin › Registration periods
pathVariables:
  - key: id
    value: ''
    description: 'The record id or code (Applications APP-…, Invoices INV-…, Maintenance Requests MR-…)'
