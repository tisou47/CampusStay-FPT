$kind: http-request
name: '/admin/utility'
method: PUT
url: '{{baseUrl}}/admin/utility'
order: 4000
description: |-
  `GET|PUT /admin/utility` → `{ priceKwh, priceM3, paymentDueDays, rounding, estimateMonthly, monthsHeld, blockChangesWhenOverdue, options: { paymentDueDays, rounding } }` (the reading day and the overdue reminder were removed: nothing used them, BE-3RD-07)

  Contract: `tools/postman/api-contract.md` › Admin › Policies
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "priceKwh": 0,
      "priceM3": 0,
      "paymentDueDays": 0,
      "rounding": "",
      "estimateMonthly": 0,
      "monthsHeld": 0,
      "blockChangesWhenOverdue": false,
      "options": {
        "paymentDueDays": [
          {
            "value": "",
            "label": ""
          }
        ],
        "rounding": [
          {
            "value": "",
            "label": ""
          }
        ]
      }
    }
