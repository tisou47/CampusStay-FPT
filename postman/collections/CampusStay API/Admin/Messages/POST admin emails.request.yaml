$kind: http-request
name: '/admin/emails'
method: POST
url: '{{baseUrl}}/admin/emails'
order: 5000
description: |-
  `POST /admin/emails` (same + `channel, sendAt`) → `{ queued }`

  Contract: `docs/api-contract.md` › Admin › Messages
headers:
