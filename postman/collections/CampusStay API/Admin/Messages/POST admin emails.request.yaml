  type: json
  content: |-
    {
      "mode": "",
      "studentCode": "",
      "termId": "{{termId}}",
      "group": "",
      "block": "{{block}}",
      "gender": "",
      "templateKey": "",
      "subject": "",
      "channel": "",
      "sendAt": ""
    }
