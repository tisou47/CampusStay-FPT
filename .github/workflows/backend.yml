# Backend CI/CD (ADR-16). Every push and pull request that touches the backend runs `mvn verify`.
# On main it also builds the image (linux/amd64), pushes it to GHCR and deploys it to the Ubuntu VPS.
# Repository settings → Secrets and variables → Actions (runbook: infra/prod/README.md §1.8):
#   variables VM_HOST, VM_USER, API_DOMAIN · secret VM_SSH_KEY. The deploy job is skipped until VM_HOST is set.
#   Optional: VM_SSH_PORT (default 22); IMAGE_PLATFORM=linux/arm64 for an ARM VPS (built on GitHub's arm runner).
name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'infra/prod/**', '!infra/prod/README.md', '!infra/prod/.env.example', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false   # never cut a deploy short

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify   # integration tests start Postgres with Testcontainers (Docker is on the runner)

  image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    # Native build for the VPS's CPU: x86 by default, GitHub's free arm runner when IMAGE_PLATFORM is linux/arm64.
    runs-on: ${{ vars.IMAGE_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campusstay-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: vars.VM_HOST != ''
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read   # the VPS pulls the image with this job's token
    env:
      TARGET: ${{ vars.VM_USER }}@${{ vars.VM_HOST }}
      SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
      DEPLOY_DIR: /opt/campusstay
      API_IMAGE: ${{ needs.image.outputs.image }}
      API_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra/prod
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts
          # ssh and scp below use the VPS's SSH port.
          printf 'Host *\n  Port %s\n  ServerAliveInterval 30\n' "$SSH_PORT" > ~/.ssh/config
      - name: Copy the stack files
        run: scp infra/prod/docker-compose.yml infra/prod/Caddyfile infra/prod/backup.sh "$TARGET:$DEPLOY_DIR/"
      - name: Pull the image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$TARGET" "cd $DEPLOY_DIR && export API_IMAGE='$API_IMAGE' API_TAG='$API_TAG' \
            && docker compose pull api && docker compose up -d --remove-orphans; \
            status=\$?; docker logout ghcr.io; docker image prune -af; exit \$status"
      # Up to 5 minutes: the first start runs the migrations, loads the base data and gets the certificate.
      - name: Check health
        if: vars.API_DOMAIN != ''
        run: curl -fsS --retry 60 --retry-delay 5 --retry-all-errors "https://${{ vars.API_DOMAIN }}/api/actuator/health/readiness"
