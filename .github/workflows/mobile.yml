# Mobile checks (review REPO-16, Wave 3 QA): every push to main and every pull request that touches the students'
# Flutter app runs the analyzer and the widget tests. Infos (framework deprecations) are reported but do not fail the
# job; warnings and errors do.
name: mobile

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'   # the team's local SDK (pubspec: Dart ^3.13.7)
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
