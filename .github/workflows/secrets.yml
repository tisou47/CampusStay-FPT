# Secret scan (review REPO-16, Wave 3 QA): gitleaks checks the commits of every push and pull request for keys,
# tokens and passwords. Runs as a GitHub Action only; nothing is added to the code. Known fictional values (dev and
# test keys, the public demo password's hash) are allow-listed in .gitleaks.toml; never allow-list a real secret:
# remove it, rotate it, and only then let the check pass.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks reads the commits of the push or the pull request
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # personal-account repository: no GITLEAKS_LICENSE needed
          GITLEAKS_CONFIG: .gitleaks.toml
