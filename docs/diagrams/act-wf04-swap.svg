 to</text><text x="150" y="212" text-anchor="middle" font-size="14">swap with?</text><rect x="280" y="141" width="160" height="98" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="360" y="166.5" text-anchor="middle" font-size="15">Post my next-Term</text><text x="360" y="185.5" text-anchor="middle" font-size="15">Bed on the swap</text><text x="360" y="204.5" text-anchor="middle" font-size="15">board, or request</text><text x="360" y="223.5" text-anchor="middle" font-size="15">a post that fits</text><rect x="50" y="300" width="200" height="60" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="150" y="325.5" text-anchor="middle" font-size="15">Invite them by student</text><text x="150" y="344.5" text-anchor="middle" font-size="15">code (direct swap)</text><polygon points="835,279 955,330 835,381 715,330" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="835" y="309.5" text-anchor="middle" font-size="14">Requests window</text><text x="835" y="326.5" text-anchor="middle" font-size="14">open, both</text><text x="835" y="343.5" text-anchor="middle" font-size="14">continuing, same</text><text x="835" y="360.5" text-anchor="middle" font-size="14">gender?</text><rect x="990" y="300" width="140" height="60" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1060" y="325.5" text-anchor="middle" font-size="15">Refused with</text><text x="1060" y="344.5" text-anchor="middle" font-size="15">the reason</text><circle cx="1060" cy="430" r="17" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="1060" cy="430" r="12" fill="#000"/><rect x="725" y="430" width="220" height="60" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="835" y="455.5" text-anchor="middle" font-size="15">Swap: Invited; the other</text><text x="835" y="474.5" text-anchor="middle" font-size="15">student is notified</text><polygon points="570,546 655,580 570,614 485,580" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="570" y="576.5" text-anchor="middle" font-size="14">Accept the</text><text x="570" y="593.5" text-anchor="middle" font-size="14">swap?</text><rect x="470" y="660.5" width="200" height="79" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="570" y="686" text-anchor="middle" font-size="15">Decline, or let it</text><text x="570" y="705" text-anchor="middle" font-size="15">expire (Declined /</text><text x="570" y="724" text-anchor="middle" font-size="15">Expired)</text><circle cx="570" cy="810" r="17" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="570" cy="810" r="12" fill="#000"/><rect x="725" y="540.5" width="220" height="79" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="835" y="566" text-anchor="middle" font-size="15">Swap: Pending; the</text><text x="835" y="585" text-anchor="middle" font-size="15">Block's Staff are</text><text x="835" y="604" text-anchor="middle" font-size="15">notified</text><polygon points="1250,657.5 1350,700 1250,742.5 1150,700" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1250" y="688" text-anchor="middle" font-size="14">Rules still pass</text><text x="1250" y="705" text-anchor="middle" font-size="14">and Staff</text><text x="1250" y="722" text-anchor="middle" font-size="14">approve?</text><rect x="1385" y="660.5" width="130" height="79" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="1450" y="686" text-anchor="middle" font-size="15">Reject with a</text><text x="1450" y="705" text-anchor="middle" font-size="15">reason; both</text><text x="1450" y="724" text-anchor="middle" font-size="15">notified</text><circle cx="1450" cy="795" r="17" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="1450" cy="795" r="12" fill="#000"/><polygon points="1035,666 1115,700 1035,734 955,700" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1035" y="696.5" text-anchor="middle" font-size="14">Across two</text><text x="1035" y="713.5" text-anchor="middle" font-