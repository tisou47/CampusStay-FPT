# CampusStay FPT backend — base configuration. Secrets come from environment
# variables (see infra/.env.example); never commit real values.
spring:
  application:
    name: campusstay
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusstay}
    username: ${DB_USER:campusstay}
    password: ${DB_PASSWORD:campusstay}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway (ADR-11)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  servlet:
    context-path: /api        # contract base URL; the Vite dev proxy forwards /api here
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

campusstay:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    session-ttl: 12h                 # idle timeout without "remember me"
    remember-ttl: 30d                # idle timeout with "remember me"
    session-absolute-max: 30d        # hard limit after sign-in
    touch-interval: 5m               # how often last_used_at / expiry are refreshed
    max-failed-attempts: 5
    lock-duration: 15m
    reset-token-ttl: 30m
    invite-token-ttl: 72h
    reset-requests-per-hour: 3
    web-base-url: ${WEB_BASE_URL:http://localhost:5173}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}          # blank = Google sign-in disabled
      client-secret: ${GOOGLE_CLIENT_SECRET:}  # blank = web code flow disabled (Android ID tokens still work)
      hosted-domain: ${GOOGLE_HOSTED_DOMAIN:fpt.edu.vn}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      token-uri: https://oauth2.googleapis.com/token
  payment:                           # the account students transfer to (ADR-22); see infra/.env.example
    bank-name: ${PAYMENT_BANK_NAME:}
    bank-code: ${PAYMENT_BANK_CODE:}               # bank short name for the VietQR image service, e.g. MBBank
    account-number: ${PAYMENT_ACCOUNT_NUMBER:}     # blank = no account: no VietQR image; "I have transferred" still works
    account-name: ${PAYMENT_ACCOUNT_NAME:}
    qr-image-url: https://qr.sepay.vn/img          # public VietQR image service (no webhook, no key)
    transfer-prefix: CSTAY                         # start of every Invoice's transfer content
  app:
    expiry-interval: 5m                 # Deposit windows and roommate invitations
  req:
    expiry-interval: 5m                 # swap invitations and swap-board posts
    sla-interval: 15m                   # routing SLA checks: escalations open and close
  bil:
    overdue-interval: 1h                # unpaid Invoices past their due date become Overdue; Utility warnings
    reminder-interval: 1h               # payment reminders before deadlines; the Managers' summary of claims
  asg:
    forfeit-interval: 5m                # Allocations whose Balance passed its deadline are cancelled
    release-interval: 15m               # door codes released to paid residents; overdue terminations
    renewal-interval: 15m               # requests windows: M2 opens, M3 closes, alert before M4, unpaid fees at M7
  mnt:
    inspection-cron: "0 0 6 * * *"      # inspection runs of active schedules start (campus time)
  door-codes:
    key: ${DOOR_CODE_KEY:}            # AES-256 key, base64 of 32 random bytes; blank = door codes off (503)
  files:
    dir: ${FILES_DIR:data/files}        # uploaded receipts and photos (shared_file keeps the metadata)
    link-secret: ${FILES_LINK_SECRET:}  # signs the short-lived file links; blank = random per start
    link-ttl: 30m
  push:
    fcm-credentials-file: ${FIREBASE_CREDENTIALS_FILE:}   # Firebase service account key; blank = push off
  mail:
    from: ${MAIL_FROM:CampusStay FPT <no-reply@campusstay.test>}
    redirect-to: ${MAIL_REDIRECT_TO:}   # demo servers: every email goes to this one mailbox; blank = normal delivery
    batch-size: 20
    max-attempts: 5
    retry-base: 1m
    dispatch-interval: 30s

logging:
  level:
    root: INFO
