# Local development: Docker Compose Postgres + Mailpit (infra/docker-compose.yml).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

campusstay:
  payment:
    simulator: true   # the "Simulate bank transfer" button of the web app (A-08)

logging:
  level:
    vn.fpt.campusstay: DEBUG
