# Local development: Docker Compose Postgres + Mailpit (infra/docker-compose.yml).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

campusstay:
  payment:            # a demo account, so the payment page shows a VietQR image locally
    bank-name: MB Bank
    bank-code: MBBank
    account-number: "0000000000"
    account-name: CAMPUSSTAY FPT DEMO
  demo:
    tools: ${DEMO_TOOLS:true}           # local development: Admin › System › Reset demo data
  assistant:          # Ollama on the developer's machine (ollama pull qwen2.5:7b)
    base-url: ${ASSISTANT_BASE_URL:http://localhost:11434}
  door-codes:
    key: ZGV2LWRvb3ItY29kZS1rZXktMzItYnl0ZXMtbG9uZyE=   # development only; servers set DOOR_CODE_KEY

logging:
  level:
    vn.fpt.campusstay: DEBUG
