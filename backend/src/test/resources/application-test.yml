spring:
  flyway:
    locations: classpath:db/migration,classpath:db/test-seed

campusstay:
  mail:
    dispatch-interval: 1h
  auth:
    google:             # pinned off, so a developer's GOOGLE_* variables cannot change test results
      client-id: ""
      client-secret: ""
  payment:
    bank-name: MB Bank
    bank-code: MBBank
    account-number: "0000000000"
    account-name: CAMPUSSTAY TEST
  app:
    expiry-interval: 1h
  req:
    expiry-interval: 1h
    sla-interval: 1h
  bil:
    overdue-interval: 1h
    reminder-interval: 1h
    meter-interval: 1h
  asg:
    forfeit-interval: 1h
    release-interval: 1h
    renewal-interval: 1h
  mnt:
    inspection-cron: "-"           # tests start runs themselves
  door-codes:
    key: dGVzdC1kb29yLWNvZGUta2V5LTMyLWJ5dGVzLW9rISE=
  files:
    dir: target/test-files
    link-secret: test-link-secret
  push:                 # pinned off, so a developer's FIREBASE_CREDENTIALS_FILE cannot send real pushes
    fcm-credentials-file: ""
