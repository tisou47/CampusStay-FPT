spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

campusstay:
  mail:
    dispatch-interval: 1h
  auth:
    google:             # pinned off, so a developer's GOOGLE_* variables cannot change test results
      client-id: ""
      client-secret: ""
  payment:
    sepay-api-key: test-sepay-key
    retry-interval: 1h
  app:
    expiry-interval: 1h
  req:
    expiry-interval: 1h
  bil:
    overdue-interval: 1h
  files:
    dir: target/test-files
    link-secret: test-link-secret
  push:                 # pinned off, so a developer's FIREBASE_CREDENTIALS_FILE cannot send real pushes
    fcm-credentials-file: ""
